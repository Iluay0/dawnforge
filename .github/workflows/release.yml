name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish linux-x64
        run: dotnet publish src/Dawnforge/Dawnforge.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:Version=${GITHUB_REF_NAME#v} -o out/linux-x64

      - name: Publish win-x64
        run: dotnet publish src/Dawnforge/Dawnforge.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${GITHUB_REF_NAME#v} -o out/win-x64

      - name: Package
        run: |
          mkdir dist
          install -m 755 out/linux-x64/dawnforge dist/dawnforge
          tar -C dist -czf dist/dawnforge-linux-x64.tar.gz dawnforge
          cp out/win-x64/dawnforge.exe dist/dawnforge-win-x64.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dawnforge-linux-x64.tar.gz
            dist/dawnforge-win-x64.exe
          name: Dawnforge ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
